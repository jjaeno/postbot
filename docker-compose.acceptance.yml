# Isolated, disposable local acceptance environment. Never uses the operator's .env.
name: postbot-acceptance
x-environment: &environment
    APP_ENV: test
    DATABASE_URL: mysql://root:acceptance-local@mysql:3306/postbot_acceptance_test
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: acceptance
    S3_ACCESS_KEY_ID: acceptance
    S3_SECRET_ACCESS_KEY: acceptance-local
    STORAGE_PROVIDER: s3
    API_BASE_URL: http://api:3000
    LLM_PROVIDER: fake
    IMAGE_PROVIDER: fake
    TTS_PROVIDER: fake
    YOUTUBE_OAUTH_PROVIDER: fake
    INSTAGRAM_OAUTH_PROVIDER: fake
    TIKTOK_OAUTH_PROVIDER: fake
    JWT_ACCESS_SECRET: acceptance-only-access-secret
    JWT_REFRESH_SECRET: acceptance-only-refresh-secret
    OAUTH_ENCRYPTION_KEY: acceptance-only-encryption-key

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: acceptance-local
      MYSQL_DATABASE: postbot_acceptance_test
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -pacceptance-local --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: acceptance
      MINIO_ROOT_PASSWORD: acceptance-local
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 3s
      retries: 20
  storage-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: [/bin/sh, -ec]
    command: ["mc alias set acceptance http://minio:9000 acceptance acceptance-local && mc mb --ignore-existing acceptance/acceptance"]
  migrate:
    image: postbot-acceptance-build:local
    build:
      context: .
      target: build
    environment: *environment
    depends_on:
      mysql: { condition: service_healthy }
    command: [sh, -ec, "pnpm --filter @postbot/database exec prisma migrate deploy --schema prisma/schema.prisma && pnpm --filter @postbot/database db:seed"]
  api:
    image: postbot-acceptance-api:local
    build:
      context: .
      args: { APP: api }
    environment: *environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    command: [node, dist/main.js]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    image: postbot-acceptance-worker:local
    build:
      context: .
      args: { APP: worker }
    environment: *environment
    depends_on:
      api: { condition: service_healthy }
    command: [node, dist/main.js]
  acceptance:
    image: postbot-acceptance-build:local
    build:
      context: .
      target: build
    environment:
      <<: *environment
      RUN_RELEASE_E2E: '1'
    profiles: [test]
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_started }
    command: [pnpm, --filter, '@postbot/api', exec, vitest, run, src/release/fake-journey.e2e.spec.ts]
